[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finevidence"
version = "0.1.0"
description = "Evidence-first, reproducible financial RAG experiments"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.2.6",
  "pydantic==2.11.7",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
