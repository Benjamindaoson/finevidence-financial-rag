[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finevidence"
version = "0.1.0"
description = "Evidence-first, reproducible financial RAG experiments"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.2.6",
  "pydantic==2.11.7",
  "scikit-learn==1.6.1",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
local-llm = ["torch==2.8.0", "transformers==4.55.4", "huggingface-hub==0.34.4", "hf-xet==1.6.0", "safetensors==0.6.2"]
pdf = ["pypdf==6.0.0", "pdfplumber==0.11.10"]
visual = ["Pillow==11.3.0", "torchvision==0.23.0", "openai-clip==1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
